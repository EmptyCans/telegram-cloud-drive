<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>公开文件夹</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/inbox.js"></script>
</head>
<body>
  <main>
    <section id="inbox-panel" class="inbox-panel" aria-labelledby="inbox-title" hidden>
      <div class="toolbar">
        <h1 id="inbox-title">公开文件夹</h1>
        <div class="row">
          <a id="inbox-up" hidden>返回上级</a>
          <div id="inbox-view-switch" class="view-switch" role="group" aria-label="文件视图" hidden>
            <button type="button" data-view="list" aria-pressed="false">列表</button>
            <button type="button" data-view="grid" aria-pressed="true">网格</button>
          </div>
        </div>
      </div>
      <form id="inbox-form" hidden>
        <div>
          <strong>拖放或粘贴文件到这里上传</strong>
          <p id="inbox-limit"></p>
        </div>
        <input id="inbox-files" type="file" multiple hidden>
        <button id="inbox-submit" class="primary" type="button">上传文件</button>
      </form>
      <div id="inbox-progress" class="upload-progress" hidden>
        <span></span><progress max="100" aria-label="文件上传进度"></progress>
      </div>
      <p id="inbox-status" role="status"></p>
      <div class="inbox-list-heading" aria-hidden="true">
        <span>名称</span><span>创建时间</span><span>类型</span><span>大小</span><span>操作</span>
      </div>
      <ul id="inbox-entries" class="inbox-grid" aria-label="文件"></ul>
      <p id="inbox-empty" hidden>这个文件夹还没有文件。</p>
      <div id="inbox-pagination" class="row" hidden>
        <button id="inbox-previous">上一页</button><span id="inbox-page"></span><button id="inbox-next">下一页</button>
      </div>
    </section>
  </main>
  <dialog id="inbox-preview" class="media-preview" aria-labelledby="inbox-preview-title">
    <header class="media-header">
      <div class="media-heading"><h2 id="inbox-preview-title"></h2><p class="media-details"></p></div>
      <div class="row"><button type="button" data-preview-download>下载原文件</button><button type="button" data-preview-close aria-label="关闭">×</button></div>
    </header>
    <div class="media-stage">
      <button type="button" data-previous aria-label="上一项">‹</button>
      <div id="preview-content"></div>
      <p id="preview-status" role="status"></p>
      <button type="button" data-next aria-label="下一项">›</button>
    </div>
  </dialog>
</body>
</html>
