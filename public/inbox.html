<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>上传文件</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/inbox.js"></script>
</head>
<body>
  <main>
    <section class="inbox-panel" aria-labelledby="inbox-title">
      <h1 id="inbox-title">上传文件</h1>
      <form id="inbox-form" hidden>
        <label for="inbox-files" id="inbox-limit"></label>
        <input id="inbox-files" type="file" multiple required>
        <button id="inbox-submit" class="primary">上传</button>
      </form>
      <p id="inbox-status" role="status">正在检查收件链接…</p>
    </section>
  </main>
</body>
</html>
