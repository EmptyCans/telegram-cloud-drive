<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>文件预览</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    p { margin: 16px; }
    iframe:not([hidden]) { display: block; width: 100%; height: 100dvh; border: 0; background: white; }
    iframe.rendered-document:not([hidden]) { background: Canvas; }
    .shared-media-player { display: block; width: min(100% - 32px, 960px); max-height: calc(100dvh - 48px); margin: 24px auto; object-fit: contain; }
    audio.shared-media-player { width: min(100% - 32px, 520px); }
    .workbook-preview { display: flex; flex-direction: column; height: 100dvh; }
    .workbook-toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .workbook-toolbar span { color: var(--muted); font-size: 13px; }
    .workbook-grid { flex: 1; min-height: 0; overflow: auto; }
    .workbook-grid table { border-collapse: separate; border-spacing: 0; background: var(--surface); }
    .workbook-grid :is(td, th) { min-width: 88px; max-width: 340px; padding: 6px 10px; border: solid var(--border); border-width: 0 1px 1px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .workbook-grid th { background: var(--list-heading); color: var(--muted); font-weight: 600; }
    .workbook-grid thead th { position: sticky; top: 0; z-index: 1; }
    .workbook-grid th:first-child { position: sticky; left: 0; min-width: 48px; text-align: right; }
    .workbook-grid thead th:first-child { z-index: 2; }
  </style>
  <script type="module" src="/html-preview.js"></script>
</head>
<body>
  <p id="status" role="status">正在打开文件…</p>
  <iframe title="文件预览" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
</body>
</html>
