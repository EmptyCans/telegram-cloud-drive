<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>文件预览</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    p { margin: 16px; }
    .plain-text-preview { margin: 0; padding: clamp(16px, 4vw, 40px); white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.65 monospace; }
    iframe:not([hidden]) { display: block; width: 100%; height: 100dvh; border: 0; background: white; }
    iframe.rendered-document:not([hidden]) { background: Canvas; }
    .shared-media-player { display: block; width: min(100% - 32px, 960px); max-height: calc(100dvh - 48px); margin: 24px auto; object-fit: contain; }
    audio.shared-media-player { width: min(100% - 32px, 520px); }
    video.shared-video-full { width: 100%; height: 100dvh; max-height: none; margin: 0; background: #000; }
    .workbook-preview { display: flex; flex-direction: column; height: 100dvh; }
    .workbook-toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .workbook-toolbar span { color: var(--muted); font-size: 13px; }
    .workbook-grid { flex: 1; min-height: 0; overflow: auto; }
    .workbook-grid table { border-collapse: separate; border-spacing: 0; background: var(--surface); }
    .workbook-grid :is(td, th) { min-width: 88px; max-width: 340px; padding: 6px 10px; border: solid var(--border); border-width: 0 1px 1px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .workbook-grid th { background: var(--list-heading); color: var(--muted); font-weight: 600; }
    .workbook-sheet { position: relative; width: max-content; }
    .workbook-grid thead th { position: sticky; top: 0; z-index: 2; }
    .workbook-grid th:first-child { position: sticky; left: 0; min-width: 48px; text-align: right; }
    .workbook-grid th:first-child { z-index: 2; }
    .workbook-grid thead th:first-child { z-index: 3; }
    .workbook-picture-layer { position: absolute; z-index: 1; overflow: hidden; pointer-events: none; }
    .workbook-picture-layer figure { position: absolute; margin: 0; container-type: inline-size; }
    .workbook-picture-layer img { display: block; width: 100%; height: 100%; }
    .workbook-pictures { padding: 16px; }
    .workbook-pictures h2 { margin: 0 0 12px; font-size: 15px; }
    .workbook-pictures figure { position: relative; max-width: 100%; margin: 0 0 16px; container-type: inline-size; }
    .workbook-pictures img { display: block; width: 100%; max-width: 100%; }
    :is(.workbook-pictures, .workbook-picture-layer) figure span { position: absolute; display: grid; place-items: center; color: #171717; font-size: clamp(10px, 2cqw, 24px); font-weight: 700; }
  </style>
  <script type="module" src="/html-preview.js"></script>
</head>
<body>
  <p id="status" role="status"></p>
  <iframe title="文件预览" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
</body>
</html>
